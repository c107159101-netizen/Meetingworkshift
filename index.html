<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>各部門服務自動輪調排班系統</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      margin: 20px;
      background-color: #f4f7f6;
    }
    h1, h2 { color: #2c3e50; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .control-panel {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    button:hover { background-color: #0056b3; }
    .btn-pdf { background-color: #17a2b8; }
    .btn-pdf:hover { background-color: #138496; }
    .btn-add { background-color: #28a745; }
    .btn-add:hover { background-color: #218838; }
    .btn-danger { background-color: #dc3545; padding: 4px 8px; font-size: 12px; }
    .btn-danger:hover { background-color: #c82333; }
    
    .table-header-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
    }
    .table-header-info h2 { margin: 0; }
    .created-date {
      font-weight: bold;
      color: #333;
      font-size: 0.95em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #3b82f6;
      color: white;
    }
    .leave-table th {
      background-color: #6c757d;
    }
    .support-tag {
      color: #555;
      font-size: 0.9em;
    }
    select, input[type="date"], input[type="month"] {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    @media print {
      body { background-color: white; margin: 0; }
      .no-print, .card:not(.print-area) { display: none !important; }
      .card.print-area { box-shadow: none; padding: 0; }
      th { background-color: #3b82f6 !important; color: white !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <h1>🗓️ 聚會服務人員自動排班系統</h1>

  <!-- 控制列 -->
  <div class="card no-print">
    <div class="control-panel">
      <label for="monthSelect"><b>選擇排班月份：</b></label>
      <input type="month" id="monthSelect" value="2026-08">
      <button onclick="generateSchedule()">🎲 重新編排 / 生成排班表</button>
      <button class="btn-pdf" onclick="exportToPDF()">📄 匯出 PDF / 列印</button>
    </div>
  </div>

  <!-- 請假登記區塊 -->
  <div class="card no-print">
    <h2>📝 如有預知不在的日期可以先登記，利於當天工作調度</h2>
    <table class="leave-table" id="leaveTable">
      <thead>
        <tr>
          <th style="width: 25%;">名字</th>
          <th>請假日期 (1)</th>
          <th>請假日期 (2)</th>
          <th>請假日期 (3)</th>
          <th style="width: 10%;">操作</th>
        </tr>
      </thead>
      <tbody id="leaveTbody">
        <!-- 動態請假列 -->
      </tbody>
    </table>
    <br>
    <button class="btn-add" onclick="addLeaveRow()">➕ 新增請假登記欄</button>
  </div>

  <!-- 排班結果 -->
  <div class="card print-area">
    <div class="table-header-info">
      <h2 id="scheduleTitle">2026-08月 各部門服務分配表</h2>
      <div class="created-date" id="createdDateDisplay">製造日期：YYYYMMDD</div>
    </div>
    
    <table id="resultTable">
      <thead>
        <tr>
          <th>服務期間</th>
          <th>第一位到聚會所開門</th>
          <th>影音部 (電腦)</th>
          <th>影音部 (音響、麥克風)</th>
          <th>招待員 (監視器/開門)</th>
          <th>招待員 (開始招待/點人數)</th>
          <th>講台服務</th>
        </tr>
      </thead>
      <tbody>
        <!-- 動態產生 -->
      </tbody>
    </table>
  </div>

<script>
// 1. 所有人員名單
const allStaffNames = [
  "洪承緯", "呂喬瑋", "吳和融", "劉奕呈", 
  "許郁娸", "祝暉晴", "洪書念(待定)", "吳閔媛",
  "賴良昭", "陳建台", "高睿理", "林金文", 
  "幸秉憲", "吳金發", "呂正金"
];

// 2. 性別標記 (M: 男, F: 女)
const genderMap = {
  "洪承緯": "M", "呂喬瑋": "M", "吳和融": "M", "劉奕呈": "M",
  "許郁娸": "F", "祝暉晴": "F", "洪書念(待定)": "F", "吳閔媛": "F",
  "賴良昭": "M", "陳建台": "M", "高睿理": "M", "林金文": "M", 
  "幸秉憲": "M", "吳金發": "M", "呂正金": "M"
};

// 3. 夫妻嚴格對照表
const spouseMap = {
  "洪承緯": "洪書念(待定)",
  "洪書念(待定)": "洪承緯",
  "吳和融": "吳閔媛",
  "吳閔媛": "吳和融"
};

// 4. 各崗位可用人員
const staffPool = {
  openDoor: ["賴良昭", "洪承緯", "劉奕呈", "陳建台"],
  avComputer: ["洪承緯", "呂喬瑋", "吳和融", "劉奕呈", "許郁娸", "祝暉晴", "洪書念(待定)", "吳閔媛"],
  avAudio: ["洪承緯", "呂喬瑋", "吳和融", "劉奕呈", "許郁娸", "祝暉晴", "洪書念(待定)", "吳閔媛"],
  greeterDoor: ["高睿理", "林金文", "幸秉憲", "陳建台", "賴良昭"],
  greeterCount: ["高睿理", "林金文", "幸秉憲", "吳金發", "陳建台", "呂正金", "賴良昭"],
  stageService: ["高睿理", "林金文", "幸秉憲", "吳金發", "陳建台", "呂正金", "賴良昭"]
};

let serviceCounts = {};

function addLeaveRow(defaultName = "", defaultDate = "") {
  const tbody = document.getElementById("leaveTbody");
  const tr = document.createElement("tr");

  let optionsHtml = '<option value="">-- 請選擇人員 --</option>';
  allStaffNames.forEach(name => {
    const selected = name === defaultName ? 'selected' : '';
    optionsHtml += `<option value="${name}" ${selected}>${name}</option>`;
  });

  tr.innerHTML = `
    <td><select class="leave-name">${optionsHtml}</select></td>
    <td><input type="date" class="leave-date" value="${defaultDate}"></td>
    <td><input type="date" class="leave-date"></td>
    <td><input type="date" class="leave-date"></td>
    <td><button class="btn-danger" onclick="this.closest('tr').remove()">刪除</button></td>
  `;
  tbody.appendChild(tr);
}

function getAbsentListForPeriod(startDateStr, endDateStr) {
  const absentSet = new Set();
  const rows = document.querySelectorAll("#leaveTbody tr");
  
  const start = new Date(startDateStr);
  const end = new Date(endDateStr);

  rows.forEach(row => {
    const name = row.querySelector(".leave-name").value;
    if (!name) return;

    const dateInputs = row.querySelectorAll(".leave-date");
    dateInputs.forEach(input => {
      if (input.value) {
        const leaveDate = new Date(input.value);
        if (leaveDate >= start && leaveDate <= end) {
          absentSet.add(name);
          if (spouseMap[name]) absentSet.add(spouseMap[name]);
        }
      }
    });
  });

  return absentSet;
}

function initCounts() {
  serviceCounts = {};
  allStaffNames.forEach(name => {
    serviceCounts[name] = 0;
  });
}

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

// 影音部嚴格配對檢查（硬性規範：必須是夫妻關係，或同性別）
function isStrictValidAVPair(p1, p2) {
  if (!p1 || !p2) return false;
  
  // 規則 1：如果是夫妻，允許搭檔
  const isSpouse = spouseMap[p1] === p2;
  if (isSpouse) return true;

  // 規則 2：如果有一方是夫妻檔之一，但另一半不是其配偶，則拒絕（防止夫妻被分拆給異性）
  // 規則 3：若非夫妻，則必須滿足男男或女女（同性別）
  const sameGender = genderMap[p1] === genderMap[p2];
  return sameGender;
}

// 通用單人挑選邏輯
function pickPerson(candidates, assignedThisPeriod, absentSet) {
  let available = candidates.filter(p => !assignedThisPeriod.has(p) && !absentSet.has(p));
  if (available.length === 0) {
    const backup = candidates.filter(p => !absentSet.has(p));
    return backup.length > 0 ? backup[0] : "無可用人選";
  }

  available = shuffle([...available]);

  available.sort((a, b) => {
    const aSpouse = spouseMap[a];
    const bSpouse = spouseMap[b];
    const aSpouseIsAssigned = aSpouse && assignedThisPeriod.has(aSpouse);
    const bSpouseIsAssigned = bSpouse && assignedThisPeriod.has(bSpouse);

    if (aSpouseIsAssigned && !bSpouseIsAssigned) return -100;
    if (!aSpouseIsAssigned && bSpouseIsAssigned) return 100;

    return (serviceCounts[a] || 0) - (serviceCounts[b] || 0);
  });

  const picked = available[0];
  assignedThisPeriod.add(picked);
  serviceCounts[picked] = (serviceCounts[picked] || 0) + 1;
  return picked;
}

// 影音部雙人選拔邏輯（確保正職 + 支援強綁定合法組合）
function pickAVPair(candidates, assignedThisPeriod, absentSet) {
  let available = candidates.filter(p => !assignedThisPeriod.has(p) && !absentSet.has(p));
  available = shuffle([...available]);
  available.sort((a, b) => (serviceCounts[a] || 0) - (serviceCounts[b] || 0));

  // 搜尋符合硬性條件的 pair
  for (let i = 0; i < available.length; i++) {
    for (let j = i + 1; j < available.length; j++) {
      const p1 = available[i];
      const p2 = available[j];
      
      if (isStrictValidAVPair(p1, p2)) {
        assignedThisPeriod.add(p1);
        assignedThisPeriod.add(p2);
        serviceCounts[p1] = (serviceCounts[p1] || 0) + 1;
        serviceCounts[p2] = (serviceCounts[p2] || 0) + 1;
        return [p1, p2];
      }
    }
  }

  // 保底退路（備用）
  const main = pickPerson(candidates, assignedThisPeriod, absentSet);
  const support = pickPerson(candidates, assignedThisPeriod, absentSet);
  return [main, support];
}

function generatePeriodSchedule(periodName, startDateStr, endDateStr) {
  const assigned = new Set();
  const absentSet = getAbsentListForPeriod(startDateStr, endDateStr);

  // 1. 開門
  const open1 = pickPerson(staffPool.openDoor, assigned, absentSet);
  const open2 = pickPerson(staffPool.openDoor, assigned, absentSet);

  // 2. 影音電腦 (嚴格執行：洪&洪/吳&吳夫妻檔 或 男男/女女)
  const [computerMain, computerSupport] = pickAVPair(staffPool.avComputer, assigned, absentSet);

  // 3. 影音音響 (嚴格執行：洪&洪/吳&吳夫妻檔 或 男男/女女)
  const [audioMain, audioSupport] = pickAVPair(staffPool.avAudio, assigned, absentSet);

  // 4. 招待開門
  const gDoorMain = pickPerson(staffPool.greeterDoor, assigned, absentSet);
  const gDoorSupport1 = pickPerson(staffPool.greeterDoor, assigned, absentSet);
  const gDoorSupport2 = pickPerson(staffPool.greeterDoor, assigned, absentSet);

  // 5. 招待點人數
  const gCountMain = pickPerson(staffPool.greeterCount, assigned, absentSet);
  const gCountSupport = pickPerson(staffPool.greeterCount, assigned, absentSet);

  // 6. 講台服務
  const stageMain = pickPerson(staffPool.stageService, assigned, absentSet);
  const stageSupport = pickPerson(staffPool.stageService, assigned, absentSet);

  return `
    <tr>
      <td><b>${periodName}</b></td>
      <td>${open1}<br>${open2}</td>
      <td>${computerMain}<br><span class="support-tag">${computerSupport} (支援)</span></td>
      <td>${audioMain}<br><span class="support-tag">${audioSupport} (支援)</span></td>
      <td>${gDoorMain}<br><span class="support-tag">${gDoorSupport1} (支援)</span><br><span class="support-tag">${gDoorSupport2} (支援)</span></td>
      <td>${gCountMain}<br><span class="support-tag">${gCountSupport} (支援)</span></td>
      <td>${stageMain}<br><span class="support-tag">${stageSupport} (支援)</span></td>
    </tr>
  `;
}

function getTodayString() {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  return `${yyyy}${mm}${dd}`;
}

function generateSchedule() {
  initCounts();
  const monthVal = document.getElementById("monthSelect").value;
  const [year, month] = monthVal.split("-");
  
  document.getElementById("scheduleTitle").innerText = `${year}-${month}月 各部門服務分配表`;
  document.getElementById("createdDateDisplay").innerText = `製造日期：${getTodayString()}`;

  const m = parseInt(month);
  const period1Name = `${m}月1-16日`;
  const period2Name = `${m}月16-31日`;

  const p1Start = `${year}-${month}-01`;
  const p1End = `${year}-${month}-16`;
  const p2Start = `${year}-${month}-16`;
  const p2End = `${year}-${month}-31`;

  const tbody = document.querySelector("#resultTable tbody");
  tbody.innerHTML = 
    generatePeriodSchedule(period1Name, p1Start, p1End) + 
    generatePeriodSchedule(period2Name, p2Start, p2End);
}

function exportToPDF() {
  window.print();
}

window.onload = function() {
  addLeaveRow("洪承緯", "2026-08-05");
  generateSchedule();
};
</script>

</body>
</html>
