<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>各部門服務自動輪調排班系統</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: "Microsoft JhengHei", "PingFang TC", "Helvetica Neue", sans-serif;
      margin: 20px;
      background-color: #f0f2f5;
      color: #333;
    }
    h1, h2 { color: #2c3e50; }
    
    /* 操作介面樣式 - 圖片中不會顯示 */
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .control-panel {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover { background-color: #0056b3; }
    .btn-png { background-color: #28a745; }
    .btn-png:hover { background-color: #218838; }
    .btn-pdf { background-color: #17a2b8; }
    .btn-pdf:hover { background-color: #138496; }
    .btn-add { background-color: #6c757d; }
    .btn-add:hover { background-color: #5a6268; }
    .btn-danger { background-color: #dc3545; padding: 4px 8px; font-size: 12px; border-radius: 4px;}
    .btn-danger:hover { background-color: #c82333; }

    /* =========================================
       🖼️ 公告班表圖片專用樣式 ( print-area )
       目標：簡約、好閱讀、符合 4:3
       ========================================= */
    #exportArea {
      position: relative;
      background: white;
      color: #333;
      overflow: hidden; /* 確保內容不超出 */
      
      /* 強制 4:3 比例 (例如 1200x900) */
      width: 1200px;
      height: 900px;
      
      /* 內容居中排版 */
      display: flex;
      flex-direction: column;
      padding: 60px; /* 增大留白 */
      box-sizing: border-box;
      border: 1px solid #eee; /* 用於網頁預覽時標示邊界 */
      margin: 0 auto; /* 網頁預覽時居中 */
    }

    .table-header-info {
      text-align: center;
      margin-bottom: 50px;
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 20px;
    }
    .table-header-info h2 { 
      margin: 0; 
      font-size: 42px; /* 標題加大 */
      color: #1a1a1a;
      letter-spacing: 2px;
    }
    .created-date {
      display: block;
      margin-top: 15px;
      color: #888;
      font-size: 16px;
      font-weight: normal;
    }

    /* 圖片專用表格樣式：無框線、大字體、大間距 */
    #resultTable {
      width: 100%;
      border-collapse: collapse;
      font-size: 20px; /* 整體字體放大 */
      table-layout: fixed; /* 固定列寬以平分空間 */
    }
    #resultTable th, #resultTable td {
      border: none; /* 移除邊框 */
      padding: 30px 15px; /* 顯著增大內距 */
      text-align: center;
      vertical-align: middle;
      word-wrap: break-word;
    }
    
    /* 表頭：淺色背景、分隔線 */
    #resultTable thead th {
      background-color: #f8faff; /* 淡藍雅致背景 */
      color: #555;
      font-weight: bold;
      font-size: 18px;
      border-bottom: 2px solid #dee2e6;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* 內容行：橫向底線分隔 */
    #resultTable tbody tr td {
      border-bottom: 1px solid #eaeaea;
      line-height: 1.6; /* 增大行高 */
    }
    #resultTable tbody tr:last-child td {
      border-bottom: none; /* 最後一行無底線 */
    }
    
    /* 服務期間列：加粗 */
    #resultTable td:first-child b {
      font-size: 24px;
      color: #007bff;
    }

    /* 支援人員樣式：淡化、縮小 */
    .support-tag {
      color: #999;
      font-size: 16px;
      display: block; /* 換行顯示 */
      margin-top: 5px;
    }

    /* 用於網頁預覽時隱藏匯出區域的滾動條 */
    .print-area-wrapper {
      width: 100%;
      overflow-x: auto; 
      padding-bottom: 20px;
    }

    /* 列印與請假區塊樣式 */
    .leave-table th { background-color: #6c757d; color: white;}
    
    @media print {
      body { background-color: white; margin: 0; }
      .no-print, .card:not(.print-area) { display: none !important; }
      #exportArea { 
        width: 100%; height: auto; border: none; padding: 20px; box-shadow: none; 
        transform: scale(1); /* 確保列印時不縮放 */
      }
      #resultTable thead th { background-color: #f8faff !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <h1 class="no-print">🗓️ 聚會服務人員自動排班系統</h1>

  <div class="card no-print">
    <div class="control-panel">
      <label for="monthSelect"><b>選擇排班月份：</b></label>
      <input type="month" id="monthSelect" value="2026-08">
      <button onclick="generateSchedule()">🎲 重新編排 / 生成排班表</button>
      <button class="btn-png" onclick="exportToPNG()">🖼️ 匯出公告用 PNG (4:3)</button>
      <button class="btn-pdf" onclick="exportToPDF()">📄 匯出 PDF / 列印</button>
    </div>
  </div>

  <div class="card no-print">
    <h2>📝 如有預知不在的日期可以先登記，利於當天工作調度</h2>
    <table class="leave-table" id="leaveTable">
      <thead>
        <tr>
          <th style="width: 25%;">名字</th>
          <th>請假日期 (1)</th>
          <th>請假日期 (2)</th>
          <th>請假日期 (3)</th>
          <th style="width: 10%;">操作</th>
        </tr>
      </thead>
      <tbody id="leaveTbody">
        </tbody>
    </table>
    <br>
    <button class="btn-add" onclick="addLeaveRow()">➕ 新增請假登記欄</button>
  </div>

  <div class="print-area-wrapper">
    <div class="print-area" id="exportArea">
      <div class="table-header-info">
        <h2 id="scheduleTitle">2026-08月 各部門服務分配表</h2>
        <span class="created-date" id="createdDateDisplay">製造日期：YYYYMMDD</span>
      </div>
      
      <table id="resultTable">
        <thead>
          <tr>
            <th style="width: 15%;">服務期間</th>
            <th>開門人員</th>
            <th>影音部 (電腦)</th>
            <th>影音部 (音響)</th>
            <th>招待員 (門口)</th>
            <th>招待員 (人數)</th>
            <th>講台服務</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>
  </div>

<script>
// 1. 所有人員名單與分類 (維持原有邏輯)
const allStaffNames = [
  "洪承緯", "呂喬瑋", "吳和融", "劉奕呈", 
  "許郁娸", "祝暉晴", "洪書念", "吳閔媛",
  "賴良昭", "陳建台", "高睿理", "林金文", 
  "幸秉憲", "吳金發", "呂正金"
];
const avCompMen = ["洪承緯", "呂喬瑋", "吳和融", "劉奕呈"];
const avSisters = ["許郁娸", "祝暉晴", "洪書念", "吳閔媛"];
const spouseMap = { "洪承緯": "洪書念", "洪書念": "洪承緯", "吳和融": "吳閔媛", "吳閔媛": "吳和融" };
const staffPool = {
  openDoor: ["賴良昭", "洪承緯", "劉奕呈", "陳建台"],
  greeterDoor: ["高睿理", "林金文", "幸秉憲", "陳建台", "賴良昭"],
  greeterCount: ["高睿理", "林金文", "幸秉憲", "吳金發", "陳建台", "呂正金", "賴良昭"],
  stageService: ["高睿理", "林金文", "幸秉憲", "吳金發", "陳建台", "呂正金", "賴良昭"]
};

let serviceCounts = {};

// 介面交互 (維持原有)
function addLeaveRow(defaultName = "", defaultDate = "") {
  const tbody = document.getElementById("leaveTbody");
  const tr = document.createElement("tr");
  let optionsHtml = '<option value="">-- 請選擇人員 --</option>';
  allStaffNames.forEach(name => {
    const selected = name === defaultName ? 'selected' : '';
    optionsHtml += `<option value="${name}" ${selected}>${name}</option>`;
  });
  tr.innerHTML = `<td><select class="leave-name">${optionsHtml}</select></td><td><input type="date" class="leave-date" value="${defaultDate}"></td><td><input type="date" class="leave-date"></td><td><input type="date" class="leave-date"></td><td><button class="btn-danger" onclick="this.closest('tr').remove()">刪除</button></td>`;
  tbody.appendChild(tr);
}

function getAbsentListForPeriod(startDateStr, endDateStr) {
  const absentSet = new Set();
  const rows = document.querySelectorAll("#leaveTbody tr");
  const start = new Date(startDateStr);
  const end = new Date(endDateStr);
  rows.forEach(row => {
    const name = row.querySelector(".leave-name").value;
    if (!name) return;
    row.querySelectorAll(".leave-date").forEach(input => {
      if (input.value) {
        const leaveDate = new Date(input.value);
        if (leaveDate >= start && leaveDate <= end) {
          absentSet.add(name);
          if (spouseMap[name]) absentSet.add(spouseMap[name]);
        }
      }
    });
  });
  return absentSet;
}

function initCounts() { serviceCounts = {}; allStaffNames.forEach(name => { serviceCounts[name] = 0; }); }
function shuffle(array) { return [...array].sort(() => Math.random() - 0.5); }

// 排班核心邏輯 (維持原有嚴格約束)
function pickAVMainPair(assignedThisPeriod, absentSet) {
  const validPairs = [];
  [["洪承緯", "洪書念"], ["吳和融", "吳閔媛"]].forEach(([husband, wife]) => {
    if (!assignedThisPeriod.has(husband) && !assignedThisPeriod.has(wife) && !absentSet.has(husband) && !absentSet.has(wife)) {
      validPairs.push([husband, wife]);
    }
  });
  const availMen = avCompMen.filter(m => !assignedThisPeriod.has(m) && !absentSet.has(m));
  availMen.forEach(man => {
    if (man === "洪承緯" && !assignedThisPeriod.has("洪書念") && !absentSet.has("洪書念")) return;
    if (man === "吳和融" && !assignedThisPeriod.has("吳閔媛") && !absentSet.has("吳閔媛")) return;
    ["許郁娸", "祝暉晴"].filter(s => !assignedThisPeriod.has(s) && !absentSet.has(s)).forEach(sis => { validPairs.push([man, sis]); });
    availMen.filter(m2 => m2 !== man).forEach(m2 => { validPairs.push([man, m2]); });
  });
  if (validPairs.length === 0) return ["人力不足", "人力不足"];
  const selected = shuffle(validPairs).sort((a, b) => ((serviceCounts[a[0]]||0)+(serviceCounts[a[1]]||0)) - ((serviceCounts[b[0]]||0)+(serviceCounts[b[1]]||0)))[0];
  assignedThisPeriod.add(selected[0]); assignedThisPeriod.add(selected[1]);
  serviceCounts[selected[0]] = (serviceCounts[selected[0]]||0)+1; serviceCounts[selected[1]] = (serviceCounts[selected[1]]||0)+1;
  return selected;
}

function pickAVSupportPair(assignedThisPeriod, absentSet) {
  let availMen = shuffle(avCompMen.filter(m => !assignedThisPeriod.has(m) && !absentSet.has(m))).sort((a, b) => (serviceCounts[a]||0) - (serviceCounts[b]||0));
  let cSup = "人力不足", aSup = "人力不足";
  if (availMen.length >= 2) { cSup = availMen[0]; aSup = availMen[1]; }
  else if (availMen.length === 1) { cSup = availMen[0]; const freeSis = avSisters.filter(s => !assignedThisPeriod.has(s) && !absentSet.has(s)); if(freeSis.length > 0) aSup = freeSis[0]; }
  if (cSup !== "人力不足") { assignedThisPeriod.add(cSup); serviceCounts[cSup] = (serviceCounts[cSup]||0)+1; }
  if (aSup !== "人力不足") { assignedThisPeriod.add(aSup); serviceCounts[aSup] = (serviceCounts[aSup]||0)+1; }
  return [cSup, aSup];
}

function pickPerson(candidates, assignedThisPeriod, absentSet, localAssigned = new Set()) {
  let avail = candidates.filter(p => !assignedThisPeriod.has(p) && !absentSet.has(p) && !localAssigned.has(p));
  if (avail.length === 0) { avail = candidates.filter(p => !absentSet.has(p) && !localAssigned.has(p)); }
  if (avail.length === 0) return "人力不足";
  const picked = shuffle(avail).sort((a, b) => (serviceCounts[a]||0) - (serviceCounts[b]||0))[0];
  assignedThisPeriod.add(picked); localAssigned.add(picked); serviceCounts[picked] = (serviceCounts[picked]||0)+1;
  return picked;
}

// 生成排班結果並渲染表格
function generatePeriodSchedule(periodName, startDateStr, endDateStr) {
  const assigned = new Set();
  const absentSet = getAbsentListForPeriod(startDateStr, endDateStr);

  const [computerMain, audioMain] = pickAVMainPair(assigned, absentSet);
  const [computerSupport, audioSupport] = pickAVSupportPair(assigned, absentSet);

  const openLocal = new Set();
  const open1 = pickPerson(staffPool.openDoor, assigned, absentSet, openLocal);
  const open2 = pickPerson(staffPool.openDoor, assigned, absentSet, openLocal);

  const gDoorLocal = new Set();
  const gDoorMain = pickPerson(staffPool.greeterDoor, assigned, absentSet, gDoorLocal);
  const gDoorSupport1 = pickPerson(staffPool.greeterDoor, assigned, absentSet, gDoorLocal);
  const gDoorSupport2 = pickPerson(staffPool.greeterDoor, assigned, absentSet, gDoorLocal);

  const gCountLocal = new Set();
  const gCountMain = pickPerson(staffPool.greeterCount, assigned, absentSet, gCountLocal);
  const gCountSupport = pickPerson(staffPool.greeterCount, assigned, absentSet, gCountLocal);

  const stageLocal = new Set();
  const stageMain = pickPerson(staffPool.stageService, assigned, absentSet, stageLocal);
  const stageSupport = pickPerson(staffPool.stageService, assigned, absentSet, stageLocal);

  // 渲染為公告用簡約排版 (支援人員換行、變小)
  return `<tr>
    <td><b>${periodName}</b></td>
    <td>${open1}<br>${open2}</td>
    <td>${computerMain}<span class="support-tag">${computerSupport} (支)</span></td>
    <td>${audioMain}<span class="support-tag">${audioSupport} (支)</span></td>
    <td>${gDoorMain}<span class="support-tag">${gDoorSupport1}, ${gDoorSupport2} (支)</span></td>
    <td>${gCountMain}<span class="support-tag">${gCountSupport} (支)</span></td>
    <td>${stageMain}<span class="support-tag">${stageSupport} (支)</span></td>
  </tr>`;
}

function getTodayString() {
  const today = new Date();
  return `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
}

// 主生成函數
function generateSchedule() {
  initCounts();
  const monthVal = document.getElementById("monthSelect").value;
  if(!monthVal) return;
  const [year, month] = monthVal.split("-");
  
  // 更新圖片內的標題與日期
  document.getElementById("scheduleTitle").innerText = `${parseInt(month)}月 部門服務分配表`;
  document.getElementById("createdDateDisplay").innerText = `發佈日期：${getTodayString()}`;

  const lastDay = new Date(year, month, 0).getDate(); // 計算該月最後一天
  const tbody = document.querySelector("#resultTable tbody");
  tbody.innerHTML = 
    generatePeriodSchedule(`${parseInt(month)}月1-15日`, `${year}-${month}-01`, `${year}-${month}-15`) + 
    generatePeriodSchedule(`${parseInt(month)}月16-${lastDay}日`, `${year}-${month}-16`, `${year}-${month}-${lastDay}`);
}

// 🖼️ 匯出公告用 PNG 圖片 (嚴格符合 4:3 比例與公告排版)
function exportToPNG() {
  const target = document.getElementById("exportArea");
  const monthVal = document.getElementById("monthSelect").value;
  
  // 顯示加載中提示 (選擇性)
  const btn = document.querySelector('.btn-png');
  const originalText = btn.innerText;
  btn.innerText = "正在產出圖片...";
  btn.disabled = true;

  html2canvas(target, {
    backgroundColor: "#ffffff",
    scale: 2, // 提升清晰度
    useCORS: true, // 允許跨域圖片 (如有)
    width: 1200, // 強制擷取寬度
    height: 900  // 強制擷取高度
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = `${monthVal}_公告班表.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
    
    // 恢復按鈕狀態
    btn.innerText = originalText;
    btn.disabled = false;
  });
}

// 📄 匯出 PDF / 列印
function exportToPDF() { window.print(); }

// 初始載入
window.onload = function() {
  addLeaveRow("洪承緯", "2026-08-05"); // 預設請假範例
  generateSchedule();
};
</script>

</body>
</html>
