<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>各部門服務自動輪調排班系統</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      margin: 20px;
      background-color: #f4f7f6;
    }
    h1, h2 { color: #2c3e50; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .control-panel {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    button:hover { background-color: #0056b3; }
    .btn-pdf { background-color: #17a2b8; }
    .btn-pdf:hover { background-color: #138496; }
    .btn-add { background-color: #28a745; }
    .btn-add:hover { background-color: #218838; }
    .btn-danger { background-color: #dc3545; padding: 4px 8px; font-size: 12px; }
    .btn-danger:hover { background-color: #c82333; }
    
    .table-header-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
    }
    .table-header-info h2 { margin: 0; }
    .created-date {
      font-weight: bold;
      color: #333;
      font-size: 0.95em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #3b82f6;
      color: white;
    }
    .leave-table th {
      background-color: #6c757d;
    }
    .support-tag {
      color: #555;
      font-size: 0.9em;
    }
    select, input[type="date"], input[type="month"] {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    @media print {
      body { background-color: white; margin: 0; }
      .no-print, .card:not(.print-area) { display: none !important; }
      .card.print-area { box-shadow: none; padding: 0; }
      th { background-color: #3b82f6 !important; color: white !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <h1>🗓️ 聚會服務人員自動排班系統</h1>

  <!-- 控制列 -->
  <div class="card no-print">
    <div class="control-panel">
      <label for="monthSelect"><b>選擇排班月份：</b></label>
      <input type="month" id="monthSelect" value="2026-08">
      <button onclick="generateSchedule()">🎲 重新編排 / 生成排班表</button>
      <button class="btn-pdf" onclick="exportToPDF()">📄 匯出 PDF / 列印</button>
    </div>
  </div>

  <!-- 請假登記區塊 -->
  <div class="card no-print">
    <h2>📝 如有預知不在的日期可以先登記，利於當天工作調度</h2>
    <table class="leave-table" id="leaveTable">
      <thead>
        <tr>
          <th style="width: 25%;">名字</th>
          <th>請假日期 (1)</th>
          <th>請假日期 (2)</th>
          <th>請假日期 (3)</th>
          <th style="width: 10%;">操作</th>
        </tr>
      </thead>
      <tbody id="leaveTbody">
        <!-- 動態請假列 -->
      </tbody>
    </table>
    <br>
    <button class="btn-add" onclick="addLeaveRow()">➕ 新增請假登記欄</button>
  </div>

  <!-- 排班結果 -->
  <div class="card print-area">
    <div class="table-header-info">
      <h2 id="scheduleTitle">2026-08月 各部門服務分配表</h2>
      <div class="created-date" id="createdDateDisplay">製造日期：YYYYMMDD</div>
    </div>
    
    <table id="resultTable">
      <thead>
        <tr>
          <th>服務期間</th>
          <th>第一位到聚會所開門</th>
          <th>影音部 (電腦)</th>
          <th>影音部 (音響、麥克風)</th>
          <th>招待員 (監視器/開門)</th>
          <th>招待員 (開始招待/點人數)</th>
          <th>講台服務</th>
        </tr>
      </thead>
      <tbody>
        <!-- 動態產生 -->
      </tbody>
    </table>
  </div>

<script>
// 所有人員名單
const allStaffNames = [
  "洪承緯", "呂喬瑋", "吳和融", "劉奕呈", 
  "許郁娸", "祝暉晴", "洪書念", "吳閔媛",
  "賴良昭", "陳建台", "高睿理", "林金文", 
  "幸秉憲", "吳金發", "呂正金"
];

// 影音部分類名單
const avCompMen = ["洪承緯", "呂喬瑋", "吳和融", "劉奕呈"];
const avSisters = ["許郁娸", "祝暉晴", "洪書念", "吳閔媛"];

// 夫妻嚴格綁定對照
const spouseMap = {
  "洪承緯": "洪書念",
  "洪書念": "洪承緯",
  "吳和融": "吳閔媛",
  "吳閔媛": "吳和融"
};

// 各崗位可用人員名冊
const staffPool = {
  openDoor: ["賴良昭", "洪承緯", "劉奕呈", "陳建台"],
  greeterDoor: ["高睿理", "林金文", "幸秉憲", "陳建台", "賴良昭"],
  greeterCount: ["高睿理", "林金文", "幸秉憲", "吳金發", "陳建台", "呂正金", "賴良昭"],
  stageService: ["高睿理", "林金文", "幸秉憲", "吳金發", "陳建台", "呂正金", "賴良昭"]
};

let serviceCounts = {};

function addLeaveRow(defaultName = "", defaultDate = "") {
  const tbody = document.getElementById("leaveTbody");
  const tr = document.createElement("tr");

  let optionsHtml = '<option value="">-- 請選擇人員 --</option>';
  allStaffNames.forEach(name => {
    const selected = name === defaultName ? 'selected' : '';
    optionsHtml += `<option value="${name}" ${selected}>${name}</option>`;
  });

  tr.innerHTML = `
    <td><select class="leave-name">${optionsHtml}</select></td>
    <td><input type="date" class="leave-date" value="${defaultDate}"></td>
    <td><input type="date" class="leave-date"></td>
    <td><input type="date" class="leave-date"></td>
    <td><button class="btn-danger" onclick="this.closest('tr').remove()">刪除</button></td>
  `;
  tbody.appendChild(tr);
}

function getAbsentListForPeriod(startDateStr, endDateStr) {
  const absentSet = new Set();
  const rows = document.querySelectorAll("#leaveTbody tr");
  
  const start = new Date(startDateStr);
  const end = new Date(endDateStr);

  rows.forEach(row => {
    const name = row.querySelector(".leave-name").value;
    if (!name) return;

    const dateInputs = row.querySelectorAll(".leave-date");
    dateInputs.forEach(input => {
      if (input.value) {
        const leaveDate = new Date(input.value);
        if (leaveDate >= start && leaveDate <= end) {
          absentSet.add(name);
          if (spouseMap[name]) absentSet.add(spouseMap[name]);
        }
      }
    });
  });

  return absentSet;
}

function initCounts() {
  serviceCounts = {};
  allStaffNames.forEach(name => {
    serviceCounts[name] = 0;
  });
}

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

// 1. 影音部 正職挑選（電腦必為弟兄，音響符合夫妻或姊妹）
function pickAVMainPair(assignedThisPeriod, absentSet) {
  const validPairs = [];

  // (1) 檢查夫妻組合（洪承緯+洪書念 或 吳和融+吳閔媛）
  const couples = [
    ["洪承緯", "洪書念"],
    ["吳和融", "吳閔媛"]
  ];
  couples.forEach(([husband, wife]) => {
    if (!assignedThisPeriod.has(husband) && !assignedThisPeriod.has(wife) &&
        !absentSet.has(husband) && !absentSet.has(wife)) {
      validPairs.push([husband, wife]);
    }
  });

  // (2) 其餘組合：電腦為弟兄，音響優先指派「許郁娸」或「祝暉晴」（非夫妻之姊妹）
  const availMen = avCompMen.filter(m => !assignedThisPeriod.has(m) && !absentSet.has(m));
  availMen.forEach(man => {
    // 若該弟兄為夫妻檔且妻子未請假，則保留給夫妻檔優先
    if (man === "洪承緯" && !assignedThisPeriod.has("洪書念") && !absentSet.has("洪書念")) return;
    if (man === "吳和融" && !assignedThisPeriod.has("吳閔媛") && !absentSet.has("吳閔媛")) return;

    // 音響可配對一般姊妹
    const freeSisters = ["許郁娸", "祝暉晴"].filter(s => !assignedThisPeriod.has(s) && !absentSet.has(s));
    freeSisters.forEach(sis => {
      validPairs.push([man, sis]);
    });

    // 若姊妹皆已排定，允許純男男正職搭檔
    const otherMen = availMen.filter(m2 => m2 !== man);
    otherMen.forEach(m2 => {
      validPairs.push([man, m2]);
    });
  });

  if (validPairs.length === 0) return ["無合格人選", "無合格人選"];

  const shuffledPairs = shuffle(validPairs);
  shuffledPairs.sort((pairA, pairB) => {
    const scoreA = (serviceCounts[pairA[0]] || 0) + (serviceCounts[pairA[1]] || 0);
    const scoreB = (serviceCounts[pairB[0]] || 0) + (serviceCounts[pairB[1]] || 0);
    return scoreA - scoreB;
  });

  const selected = shuffledPairs[0];
  assignedThisPeriod.add(selected[0]);
  assignedThisPeriod.add(selected[1]);
  serviceCounts[selected[0]] = (serviceCounts[selected[0]] || 0) + 1;
  serviceCounts[selected[1]] = (serviceCounts[selected[1]] || 0) + 1;
  return selected; // [電腦正職, 音響正職]
}

// 2. 影音部 支援挑選（🌟 電腦支援 與 音響支援 均以弟兄為主）
function pickAVSupportPair(assignedThisPeriod, absentSet) {
  // 優先從影音部可用弟兄中挑選
  let availMen = avCompMen.filter(m => !assignedThisPeriod.has(m) && !absentSet.has(m));
  availMen = shuffle(availMen);
  availMen.sort((a, b) => (serviceCounts[a] || 0) - (serviceCounts[b] || 0));

  let compSupport = "";
  let audioSupport = "";

  if (availMen.length >= 2) {
    compSupport = availMen[0];
    audioSupport = availMen[1];
  } else if (availMen.length === 1) {
    compSupport = availMen[0];
    // 備用：若弟兄不足，音響支援退回姊妹
    const freeSisters = avSisters.filter(s => !assignedThisPeriod.has(s) && !absentSet.has(s));
    audioSupport = freeSisters.length > 0 ? freeSisters[0] : "人力不足";
  } else {
    // 備用退路
    compSupport = "人力不足";
    audioSupport = "人力不足";
  }

  if (compSupport !== "人力不足") {
    assignedThisPeriod.add(compSupport);
    serviceCounts[compSupport] = (serviceCounts[compSupport] || 0) + 1;
  }
  if (audioSupport !== "人力不足") {
    assignedThisPeriod.add(audioSupport);
    serviceCounts[audioSupport] = (serviceCounts[audioSupport] || 0) + 1;
  }

  return [compSupport, audioSupport];
}

// 通用單人指派（防止同人自己支援自己）
function pickPerson(candidates, assignedThisPeriod, absentSet, localAssigned = new Set()) {
  let available = candidates.filter(p => !assignedThisPeriod.has(p) && !absentSet.has(p) && !localAssigned.has(p));
  
  if (available.length === 0) {
    available = candidates.filter(p => !absentSet.has(p) && !localAssigned.has(p));
  }

  if (available.length === 0) {
    return "無可用人選";
  }

  available = shuffle(available);
  available.sort((a, b) => (serviceCounts[a] || 0) - (serviceCounts[b] || 0));

  const picked = available[0];
  assignedThisPeriod.add(picked);
  localAssigned.add(picked);
  serviceCounts[picked] = (serviceCounts[picked] || 0) + 1;
  return picked;
}

function generatePeriodSchedule(periodName, startDateStr, endDateStr) {
  const assigned = new Set();
  const absentSet = getAbsentListForPeriod(startDateStr, endDateStr);

  // 1. 影音部 正職 (電腦為弟兄，音響為配偶或姊妹)
  const [computerMain, audioMain] = pickAVMainPair(assigned, absentSet);

  // 2. 影音部 支援 (電腦支援 & 音響支援 皆為弟兄)
  const [computerSupport, audioSupport] = pickAVSupportPair(assigned, absentSet);

  // 3. 第一位到聚會所開門 (2位不同人)
  const openLocal = new Set();
  const open1 = pickPerson(staffPool.openDoor, assigned, absentSet, openLocal);
  const open2 = pickPerson(staffPool.openDoor, assigned, absentSet, openLocal);

  // 4. 招待員-開門 (3位不同人)
  const gDoorLocal = new Set();
  const gDoorMain = pickPerson(staffPool.greeterDoor, assigned, absentSet, gDoorLocal);
  const gDoorSupport1 = pickPerson(staffPool.greeterDoor, assigned, absentSet, gDoorLocal);
  const gDoorSupport2 = pickPerson(staffPool.greeterDoor, assigned, absentSet, gDoorLocal);

  // 5. 招待員-點人數 (正職與支援互斥)
  const gCountLocal = new Set();
  const gCountMain = pickPerson(staffPool.greeterCount, assigned, absentSet, gCountLocal);
  const gCountSupport = pickPerson(staffPool.greeterCount, assigned, absentSet, gCountLocal);

  // 6. 講台服務 (正職與支援互斥)
  const stageLocal = new Set();
  const stageMain = pickPerson(staffPool.stageService, assigned, absentSet, stageLocal);
  const stageSupport = pickPerson(staffPool.stageService, assigned, absentSet, stageLocal);

  return `
    <tr>
      <td><b>${periodName}</b></td>
      <td>${open1}<br>${open2}</td>
      <td>${computerMain}<br><span class="support-tag">${computerSupport} (支援)</span></td>
      <td>${audioMain}<br><span class="support-tag">${audioSupport} (支援)</span></td>
      <td>${gDoorMain}<br><span class="support-tag">${gDoorSupport1} (支援)</span><br><span class="support-tag">${gDoorSupport2} (支援)</span></td>
      <td>${gCountMain}<br><span class="support-tag">${gCountSupport} (支援)</span></td>
      <td>${stageMain}<br><span class="support-tag">${stageSupport} (支援)</span></td>
    </tr>
  `;
}

function getTodayString() {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  return `${yyyy}${mm}${dd}`;
}

function generateSchedule() {
  initCounts();
  const monthVal = document.getElementById("monthSelect").value;
  const [year, month] = monthVal.split("-");
  
  document.getElementById("scheduleTitle").innerText = `${year}-${month}月 各部門服務分配表`;
  document.getElementById("createdDateDisplay").innerText = `製造日期：${getTodayString()}`;

  const m = parseInt(month);
  const period1Name = `${m}月1-16日`;
  const period2Name = `${m}月16-31日`;

  const p1Start = `${year}-${month}-01`;
  const p1End = `${year}-${month}-16`;
  const p2Start = `${year}-${month}-16`;
  const p2End = `${year}-${month}-31`;

  const tbody = document.querySelector("#resultTable tbody");
  tbody.innerHTML = 
    generatePeriodSchedule(period1Name, p1Start, p1End) + 
    generatePeriodSchedule(period2Name, p2Start, p2End);
}

function exportToPDF() {
  window.print();
}

window.onload = function() {
  addLeaveRow("洪承緯", "2026-08-05");
  generateSchedule();
};
</script>

</body>
</html>
